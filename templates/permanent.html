<!DOCTYPE html>
<html lang="{{ active_lang | default('en') }}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel = "stylesheet" href = "{{ url_for('static', filename = 'style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<header>
    <nav class = "navbar">
        <a class ="home-logo main-font " href ="{{ url_for('home') }}">Tours</a>
        <div class ="nav-links">
            <a class ="teleporters main-font" href ="{{ url_for('home') }}">Home</a>
            <a class ="teleporters main-font" href ="{{ url_for('tours') }}">Tours</a>
            <a class ="teleporters main-font" href ="{{ url_for('about') }}">About</a>
            <a class ="teleporters main-font" href ="{{ url_for('booking') }}">Booking</a>
            <a class ="teleporters main-font" href ="{{ url_for('contact') }}">Contact</a>
        </div>
        <div class = "lang-selector">
            <button class = "lang-button main-font" type="button">
                {% for i in lang_info %}
                <span class ="main-font">{{ i }} ({{ active_lang }}) </span>
                {% endfor %}
                <svg class = "arrow-icon" viewBox ="0 0 24 24" width = "14" height = "14" stroke ="currentColor" stroke-width ="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div class ="lang-dropdown">
                {% for languages, attributes in language.items() %}
                    <a href="{{ url_for('set_language', lang=languages) }}" class ="lang-item main-font">{{ attributes[0] }} ({{ languages}}) </a>
                {% endfor %}
            </div>
        </div>
</nav>
</header>
<main class ="page-content">
    {% block content%}
    {% endblock %}
</main>


<footer>
    <p class="main-font my-name" style="font-size: 14px;"> © 2026 - By Firas Costa</p>
    <a href = "https://www.linkedin.com/in/firas-costa-24b655329/" target="_blank" class = "linkedin-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34" width="29" height="29" fill="currentColor">
            <path d="M34 2.5v29a2.5 2.5 0 0 1-2.5 2.5h-29A2.5 2.5 0 0 1 0 31.5v-29A2.5 2.5 0 0 1 2.5 0h29A2.5 2.5 0 0 1 34 2.5M10 13H5v16h5zm.45-5.5a2.88 2.88 0 0 0-2.86-2.9H7.5a2.9 2.9 0 0 0 0 5.8 2.88 2.88 0 0 0 2.95-2.81zM29 19.28c0-4.81-3.06-6.68-6.1-6.68a5.7 5.7 0 0 0-5.06 2.58h-.14V13H13v16h5v-8.51a3.32 3.32 0 0 1 3-3.58h.19c1.59 0 2.77 1 2.77 3.52V29h5z" ></path>
        </svg>
    </a>
</footer>
</body>
</html>
